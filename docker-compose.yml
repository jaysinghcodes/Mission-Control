# Mission Control. Postgres, API, and web UI.
# Usage: bash install.sh
# That writes a random ingest token and a dashboard password hash, runs
# docker compose up -d --build, runs doctor, and prints the URL.
# The password is printed once. A plain second run leaves .env unchanged.
# A new MC_DB_PORT updates a stock DATABASE_URL. The api service below still uses db:5432.
# Then open http://localhost:5173/#/tasks
# The browser uses that one port. nginx proxies /api and /socket.io.
# No OpenClaw? `npm run seed:demo` (from the host) fills sample data.
# Published ports bind 127.0.0.1 only. Inside the api container HOST is
# 0.0.0.0. nginx records the client address and the API trusts the web
# service (BUNDLED_PROXY, default web). A browser on the host still signs
# in. That host has its own login lock. The tunnel port never uses it.
# Leave TRUSTED_PROXY unset. Do not point it at the Docker bridge.
#
# Host ports are overridable. 5432, 3000, 5173, and 3011 are often taken:
#   MC_DB_PORT=55432 MC_API_PORT=3200 MC_WEB_PORT=5273 MC_REMOTE_PORT=4011 docker compose up -d --build
# Only the host side of each mapping moves. Inside the compose network the
# services still talk on 5432, 3000, and 5173. nginx also listens on 3011.
# MC_WEB_PORT is the owner port. SSH tunnels use that port.
# MC_REMOTE_PORT (default 3011) is for Cloudflare Tunnel and Tailscale Serve.
# WEB_ORIGIN follows MC_WEB_PORT unless you set it (see .env.example).
# The browser does not use MC_API_PORT. Leave VITE_API_URL unset so the page
# stays on the web port. Set VITE_API_URL only for a different API origin,
# then rebuild the web image.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: mission_control
    volumes:
      - mc-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mission_control"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # Host port overridable (item 6); container port stays 5432.
      - "127.0.0.1:${MC_DB_PORT:-5432}:5432"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        # Commit for GET /health. install.sh exports this from git when unset.
        # An empty value lets the image read .git during the build, if present.
        GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/mission_control
      PORT: 3000
      HOST: 0.0.0.0
      # CORS allowlist. Default is DERIVED from the web host port (item 6 /
      # QA-3): moving the web to MC_WEB_PORT=5273 with a hardcoded :5173 here
      # made every API call fail CORS. Both localhost spellings, matching the
      # api's own built-in default (apps/api/src/cors-origins.ts). An explicit
      # WEB_ORIGIN (comma-separated) still wins.
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:${MC_WEB_PORT:-5173},http://127.0.0.1:${MC_WEB_PORT:-5173}}
      # bash install.sh writes a random value. A blank value stays blank.
      # There is no dev token fallback. Ingest without a token returns 401
      # in production, including this container.
      INGEST_TOKEN: ${INGEST_TOKEN:-}
      # Dashboard login. The installer stores a scrypt hash and a session
      # secret. Blank values stay blank, and this container then refuses to
      # start because HOST is 0.0.0.0.
      DASHBOARD_PASSWORD_HASH: ${DASHBOARD_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Session version. Logout and a password change bump it here so a
      # copied cookie stays invalid after a restart. The mc-auth volume
      # keeps the file when the container is recreated. A stored hash
      # overrides DASHBOARD_PASSWORD_HASH on startup.
      SESSION_STATE_PATH: /data/auth/session-state.json
      # Failed logins per client IP. Blank uses the default in the API:
      # 5 failures, a 60 second window, then a wait that doubles up to
      # 900 seconds. Loopback is not limited.
      LOGIN_FAIL_LIMIT: ${LOGIN_FAIL_LIMIT:-5}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-60}
      LOGIN_BACKOFF_MAX_SECONDS: ${LOGIN_BACKOFF_MAX_SECONDS:-900}
      # Hostname of the bundled nginx on this network. The API resolves it
      # and trusts X-Forwarded-For and X-Real-IP only from that peer.
      # The default is the web service name. Set an IP or another hostname
      # when that service is renamed. This is not the Docker bridge.
      BUNDLED_PROXY: ${BUNDLED_PROXY:-web}
      # Extra proxies, comma separated. Blank stays blank. The bundled
      # nginx is trusted through BUNDLED_PROXY, not through this list.
      # Do not set this to the Docker bridge. That would let a browser
      # skip the password.
      TRUSTED_PROXY: ${TRUSTED_PROXY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Display only. Default assignee for new tickets and runs. Blank means Operator.
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      NODE_ENV: production
      # Docs library. This is the path INSIDE the container. The host folder
      # is the bind below, so `npm run seed:demo` on the host (DOCS_ROOT unset
      # means ./data/docs) and the api read the same files. A missing folder is
      # an empty Docs page, not a crash.
      DOCS_ROOT: /data/docs
      # Compose marker. A blank gateway host means status comes from the
      # bridge, which runs on the host and checks 127.0.0.1. Set the host
      # to probe that address from this container instead.
      MC_COMPOSE: "1"
      OPENCLAW_GATEWAY_HOST: ${OPENCLAW_GATEWAY_HOST:-}
      OPENCLAW_GATEWAY_PORT: ${OPENCLAW_GATEWAY_PORT:-}
      # A bridge report older than this many milliseconds is Unknown.
      # Blank, 0, or an invalid number uses 600000 (10 minutes).
      GATEWAY_STATUS_MAX_AGE_MS: ${GATEWAY_STATUS_MAX_AGE_MS:-600000}
      OPENCLAW_LOG_DIR: ${OPENCLAW_LOG_DIR:-/tmp/openclaw}
      # Server timezone when Settings has not saved one. Unset stays UTC.
      TZ: ${TZ:-UTC}
      # Registered bots go offline after this many milliseconds. Default 10 minutes.
      OFFLINE_AFTER_MS: ${OFFLINE_AFTER_MS:-600000}
      # Socket health.tick interval. 0 disables it. Default 30 seconds.
      HEALTH_TICK_MS: ${HEALTH_TICK_MS:-30000}
      # Usage days a snapshot may keep, through today. Default 30.
      USAGE_RETENTION_DAYS: ${USAGE_RETENTION_DAYS:-30}
    extra_hosts:
      # Linux does not provide host.docker.internal unless this mapping exists.
      - "host.docker.internal:host-gateway"
    volumes:
      # ${DOCS_ROOT} here is the HOST path from the project .env (compose
      # interpolation), not the container path set just above. `:-` keeps
      # ./data/docs when that variable is unset or empty.
      - ${DOCS_ROOT:-./data/docs}:/data/docs
      # Session version and a changed password hash. Survives recreate.
      - mc-auth:/data/auth
      # Host log directory. The same path is OPENCLAW_LOG_DIR inside the container.
      - ${OPENCLAW_LOG_DIR:-/tmp/openclaw}:${OPENCLAW_LOG_DIR:-/tmp/openclaw}
      # Default config is baked into the image. This mount overrides it.
      # prices.local.json on the host overrides a model price without a rebuild.
      - ./config:/app/config:ro
    ports:
      # Host port overridable (item 6); the api still listens on 3000 inside.
      - "127.0.0.1:${MC_API_PORT:-3000}:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Display only operator name (account chip). Blank stays Operator.
        # Same root .env value the api gets.
        VITE_OPERATOR_NAME: ${OPERATOR_NAME:-}
        # Optional Discord server id. Blank means channel ids are not links.
        VITE_DISCORD_GUILD_ID: ${VITE_DISCORD_GUILD_ID:-}
        # Optional. Blank (the default) keeps the browser on this web port.
        # nginx proxies /api and /socket.io. Set a full origin only when the
        # page should call a different API, then rebuild web.
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # Host port overridable (item 6); nginx still listens on 5173 inside.
      # This is the owner port. SSH tunnels use it.
      - "127.0.0.1:${MC_WEB_PORT:-5173}:5173"
      # Tunnel port. Cloudflare Tunnel and Tailscale Serve use the host side.
      # nginx listens on 3011 inside. Default host port is 3011.
      - "127.0.0.1:${MC_REMOTE_PORT:-3011}:3011"

volumes:
  mc-db:
  mc-auth:
