# Mission Control. Postgres, API, and web UI.
# Usage: bash install.sh
# That writes random tokens, runs docker compose up -d --build, runs doctor,
# and prints the URL. A second run keeps .env.
# Then open http://localhost:5173/#/tasks
# The browser uses that one port. nginx proxies /api and /socket.io.
# No OpenClaw? `npm run seed:demo` (from the host) fills sample data.
# Loopback first: published ports bind 127.0.0.1 only.
#
# Host ports are overridable. 5432, 3000, and 5173 are often taken:
#   MC_DB_PORT=55432 MC_API_PORT=3200 MC_WEB_PORT=5273 docker compose up -d --build
# Only the host side of each mapping moves. Inside the compose network the
# services still talk on 5432, 3000, and 5173.
# WEB_ORIGIN follows MC_WEB_PORT unless you set it (see .env.example).
# The browser does not use MC_API_PORT. Leave VITE_API_URL unset so the page
# stays on the web port. Set VITE_API_URL only for a different API origin,
# then rebuild the web image.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: mission_control
    volumes:
      - mc-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mission_control"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # Host port overridable (item 6); container port stays 5432.
      - "127.0.0.1:${MC_DB_PORT:-5432}:5432"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/mission_control
      PORT: 3000
      HOST: 0.0.0.0
      # CORS allowlist. Default is DERIVED from the web host port (item 6 /
      # QA-3): moving the web to MC_WEB_PORT=5273 with a hardcoded :5173 here
      # made every API call fail CORS. Both localhost spellings, matching the
      # api's own built-in default (apps/api/src/cors-origins.ts). An explicit
      # WEB_ORIGIN (comma-separated) still wins.
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:${MC_WEB_PORT:-5173},http://127.0.0.1:${MC_WEB_PORT:-5173}}
      # bash install.sh writes a random value. This fallback is not the installed path.
      INGEST_TOKEN: ${INGEST_TOKEN:-dev-ingest-token}
      # Socket handshake guard (gateway requires SOCKET_TOKEN when NODE_ENV=production).
      # Default matches the token baked into the web bundle (see web build args below),
      # so a fresh clone's dashboard socket works out of the box.
      SOCKET_TOKEN: ${SOCKET_TOKEN:-dev-socket-token}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Display only. Default assignee for new tickets and runs. Blank means Operator.
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      NODE_ENV: production
      # Docs library. This is the path INSIDE the container. The host folder
      # is the bind below, so `npm run seed:demo` on the host (DOCS_ROOT unset
      # means ./data/docs) and the api read the same files. A missing folder is
      # an empty Docs page, not a crash.
      DOCS_ROOT: /data/docs
    volumes:
      # ${DOCS_ROOT} here is the HOST path from the project .env (compose
      # interpolation), not the container path set just above. `:-` keeps
      # ./data/docs when that variable is unset or empty.
      - ${DOCS_ROOT:-./data/docs}:/data/docs
    ports:
      # Host port overridable (item 6); the api still listens on 3000 inside.
      - "127.0.0.1:${MC_API_PORT:-3000}:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the static bundle at build time. Must match the api's
        # SOCKET_TOKEN (same root .env value) or the socket guard rejects the
        # dashboard in production.
        VITE_SOCKET_TOKEN: ${SOCKET_TOKEN:-dev-socket-token}
        # Display only operator name (account chip). Blank stays Operator.
        # Same root .env value the api gets.
        VITE_OPERATOR_NAME: ${OPERATOR_NAME:-}
        # Optional Discord server id. Blank means channel ids are not links.
        VITE_DISCORD_GUILD_ID: ${VITE_DISCORD_GUILD_ID:-}
        # Optional. Blank (the default) keeps the browser on this web port.
        # nginx proxies /api and /socket.io. Set a full origin only when the
        # page should call a different API, then rebuild web.
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Same value the api uses, including the blank token fallback.
      # nginx attaches it on /api writes. It is not baked into the JS bundle.
      # bash install.sh writes a random value, so a fresh install does not use the fallback.
      INGEST_TOKEN: ${INGEST_TOKEN:-dev-ingest-token}
    ports:
      # Host port overridable (item 6); nginx still listens on 5173 inside.
      - "127.0.0.1:${MC_WEB_PORT:-5173}:5173"

volumes:
  mc-db:
