<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="mc-avatar" data-state="idle" data-size="md" role="img" aria-label="Lead — Chief of Staff" style="--avatar-accent:#A78BFA;--avatar-accent-deep:#5B3FB8;--avatar-body:#2A2E36;--avatar-deep:#1B1F26;--avatar-line:#3A414B;--avatar-hi:#E6E9ED;--avatar-paper:#E7DFCE;--avatar-faint:#8A939E;--status-error:#F85149">
  <g class="bob">
    <!-- crown horns -->
    <path d="M21.4 9.2 L19.6 3.6" stroke="var(--avatar-accent)" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M26.6 9.2 L28.4 3.6" stroke="var(--avatar-accent)" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="19.6" cy="3.1" r="1.1" fill="var(--avatar-accent)"/>
    <circle cx="28.4" cy="3.1" r="1.1" fill="var(--avatar-accent)"/>
    <!-- tall command head + full-width visor -->
    <rect x="16.5" y="7" width="15" height="14.5" rx="3" fill="var(--avatar-body)"/>
    <rect x="18.5" y="10.5" width="11" height="3.4" rx="1.7" fill="var(--avatar-accent)"/>
    <!-- shoulder pads -->
    <path d="M12.5 26.5 L18.5 26.5 L18 31.5 L11.5 31.5 Z" fill="var(--avatar-accent-deep)"/>
    <path d="M29.5 26.5 L35.5 26.5 L36.5 31.5 L30 31.5 Z" fill="var(--avatar-accent-deep)"/>
    <!-- body + rank bars -->
    <rect x="17" y="26" width="14" height="11" rx="3" fill="var(--avatar-body)"/>
    <rect x="20.5" y="29.8" width="7" height="1.7" rx="0.85" fill="var(--avatar-accent)"/>
    <rect x="20.5" y="32.9" width="4.6" height="1.7" rx="0.85" fill="var(--avatar-accent)" opacity="0.7"/>
    <!-- feet -->
    <rect x="19.5" y="37" width="9" height="2.2" rx="1.1" fill="var(--avatar-deep)"/>
    <g class="eyes">
      <circle cx="21" cy="12.2" r="1.5" fill="var(--avatar-hi)"/>
      <circle cx="27" cy="12.2" r="1.5" fill="var(--avatar-hi)"/>
    </g>
    <g class="eyes-error">
      <path d="M19.6 10.8 L22.4 13.6 M22.4 10.8 L19.6 13.6" stroke="var(--status-error)" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M25.6 10.8 L28.4 13.6 M28.4 10.8 L25.6 13.6" stroke="var(--status-error)" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g class="eyes-offline">
      <circle cx="21" cy="12.2" r="1.5" fill="var(--avatar-faint)"/>
      <circle cx="27" cy="12.2" r="1.5" fill="var(--avatar-faint)"/>
    </g>
    <g class="tool-active">
      <circle class="fx" cx="17.4" cy="2.2" r="0.9" fill="var(--avatar-accent)"/>
      <circle class="fx fx-2" cx="30.6" cy="2.2" r="0.9" fill="var(--avatar-accent)"/>
    </g>
    <g class="error-badge">
      <path d="M40.5 2 L44.5 9.5 L36.5 9.5 Z" fill="none" stroke="var(--status-error)" stroke-width="1.4" stroke-linejoin="round"/>
      <line x1="40.5" y1="4.6" x2="40.5" y2="6.8" stroke="var(--status-error)" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="40.5" cy="8.2" r="0.8" fill="var(--status-error)"/>
    </g>
  </g>
</svg>
