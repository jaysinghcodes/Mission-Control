name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '20'
          - '22'
          - '24'
    steps:
      - name: Check out a clean tree
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Use npm 11.17.0
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        run: npm ci

      # npm 11 does not run Prisma's install scripts. Type aware lint needs the client.
      - name: Generate the Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Lint
        run: npm run lint

  fresh-clone:
    name: Fresh clone
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '20'
          - '22'
          - '24'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mission_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mission_control"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Node prefers IPv6 localhost. The published Postgres port is IPv4.
      # .env.example stays unchanged.
      NODE_OPTIONS: --dns-result-order=ipv4first
      # npm ci should not download a browser. The smoke step installs one
      # only when this runner has no Chrome.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Check out a clean tree
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Use npm 11.17.0
        run: npm install -g npm@11.17.0

      - name: Install nginx
        run: sudo apt-get update && sudo apt-get install -y nginx

      - name: Run the README install and prove the app
        run: node scripts/fresh-clone.mjs

  install-sh:
    name: install.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out a clean tree
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bash syntax
        run: bash -n install.sh

      - name: Install shellcheck
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run install.sh with a docker stub
        run: node --test scripts/install.test.mjs

      - name: Install and uninstall the bridge schedule
        run: node --test --test-name-pattern "bridge schedule" scripts/install.test.mjs

      - name: Doctor stale bridge check
        run: node --test --test-name-pattern "bridge sync" scripts/doctor.test.mjs

  # Free GitHub hosted runners. Ubuntu proves Compose and the native path.
  # macOS proves the native path only. Docker on macOS runners is unreliable.
  fresh-install:
    name: Fresh install (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            mode: compose
            label: ubuntu compose
          - os: ubuntu-latest
            mode: native
            label: ubuntu native
            api_port: '3405'
            web_port: '5405'
          - os: macos-latest
            mode: native
            label: macos native
            api_port: '3405'
            web_port: '5405'
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      FRESH_INSTALL_MODE: ${{ matrix.mode }}
      MC_INSTALL_READY_SECONDS: '180'
      # Native jobs prove a custom PORT and MC_WEB_PORT. Compose leaves these empty.
      PORT: ${{ matrix.api_port }}
      MC_WEB_PORT: ${{ matrix.web_port }}
    steps:
      - name: Check out a clean tree
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use npm 11.17.0
        run: npm install -g npm@11.17.0

      - name: Install Postgres 16
        if: matrix.mode == 'native'
        run: sh scripts/ci-native-postgres.sh

      - name: Run bash install.sh and the fixture bridge
        run: node scripts/fresh-clone.mjs
